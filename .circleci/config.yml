version: 2.1

jobs:
  visual_no_roboto:
    machine: {image: ubuntu-2404:current}
    resource_class: large
    steps: [checkout, {run: "python3 studio/smoke_probe.py visual_no_roboto"}]
  visual_no_icons:
    machine: {image: ubuntu-2404:current}
    resource_class: large
    steps: [checkout, {run: "python3 studio/smoke_probe.py visual_no_icons"}]
  visual_no_fonts:
    machine: {image: ubuntu-2404:current}
    resource_class: large
    steps: [checkout, {run: "python3 studio/smoke_probe.py visual_no_fonts"}]

workflows:
  diagnose-fonts:
    jobs:
      - visual_no_roboto
      - visual_no_icons
      - visual_no_fonts
