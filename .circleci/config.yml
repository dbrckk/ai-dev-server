version: 2.1

jobs:
  store_listing:
    docker: [{image: cimg/python:3.12.11}]
    steps:
      - checkout
      - run: python -m unittest tests.test_store.StorePackageTests.test_listing_is_bounded_and_derived_from_brief -v
  store_assets:
    docker: [{image: cimg/python:3.12.11}]
    steps:
      - checkout
      - run: python -m unittest tests.test_store.StorePackageTests.test_builds_valid_assets_and_permission_evidence -v
  store_refusal:
    docker: [{image: cimg/python:3.12.11}]
    steps:
      - checkout
      - run: python -m unittest tests.test_store.StorePackageTests.test_refuses_package_without_two_distinct_validated_screens -v

workflows:
  diagnose:
    jobs:
      - store_listing
      - store_assets
      - store_refusal
