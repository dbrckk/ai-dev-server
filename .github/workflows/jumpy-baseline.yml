name: Jumpy Godot Baseline and Regression
on:
  workflow_dispatch:
  push:
    branches: [main, codex/jumpy-finance-regression]
    paths: ['studio/godot_baseline.py', 'studio/jumpy_baseline.gd', 'control/existing-projects/jumpy.json', '.github/workflows/jumpy-baseline.yml']
permissions:
  contents: read
jobs:
  godot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reproduce baseline defect and validate candidate
        run: python3 studio/godot_baseline.py --verify-finance-fix
      - name: Show diagnostics from the secret-free test process
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('studio-output/jumpy-baseline').glob('*')):
              if path.suffix in ('.log', '.json'):
                  print(path.name)
                  print(path.read_text(errors='replace')[-12000:])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jumpy-regression
          path: studio-output/jumpy-baseline/
