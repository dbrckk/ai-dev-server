name: Production OS Asset Forge Deadline Zero E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-os-asset-forge-e2e.yml'
      - 'studio/asset_forge_bridge.py'
      - 'studio/orchestrator.py'
      - 'studio/capabilities/asset_artwork.py'
      - 'tests/test_asset_forge_bridge.py'
      - 'tests/test_orchestrator.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-os-asset-forge-deadline-zero-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AI Dev Server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout Production OS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dbrckk/Production-OS
          path: production-os

      - name: Checkout Asset Forge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dbrckk/asset-forge
          path: asset-forge

      - name: Checkout Deadline Zero
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dbrckk/deadline-zero
          path: deadline-zero

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'

      - name: Install Production OS and Asset Forge
        run: |
          python -m pip install --no-deps ./production-os
          python -m pip install --no-deps ./asset-forge
          production-os --help >/dev/null
          asset-forge --help >/dev/null

      - name: Build routed visual request and deterministic source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/asset-forge-e2e
          PYTHONPATH="$GITHUB_WORKSPACE/studio" python - <<'PY'
          import json
          from pathlib import Path

          from asset_forge_bridge import build_production_os_asset_dispatch
          from capabilities.asset_artwork import run

          task = {
              "id": "production-pipeline-icon",
              "objective": "Create a premium professional Deadline Zero UI icon",
              "asset_type": "icon",
              "format": "svg",
              "engine": "libgdx",
          }
          route = build_production_os_asset_dispatch(task, project="deadline-zero")
          artwork = run({
              "label": "DZ",
              "objective": task["objective"],
              "assets": ["icon"],
              "design": {"primary": "#151923", "accent": "#D04B35"},
          })
          assert artwork["passed"] is True

          root = Path("build/asset-forge-e2e")
          source = root / "source.svg"
          source.write_text(artwork["assets"]["icon"]["content"], encoding="utf-8")

          command = list(route["command"])
          command.extend([
              "--mode", "local",
              "--source-mode", "custom",
              "--source", str(source),
              "--output-dir", str(root / "fulfilled"),
              "--importance", "secondary",
          ])
          (root / "route.json").write_text(
              json.dumps({**route, "command": command}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute routed request through Production OS and Asset Forge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          route = json.loads(Path("build/asset-forge-e2e/route.json").read_text())
          completed = subprocess.run(route["command"], check=False)
          raise SystemExit(completed.returncode)
          PY
          asset-forge validate-production-report build/asset-forge-e2e/fulfilled/production-report.json
          test -s build/asset-forge-e2e/fulfilled/production-pipeline-icon.svg

      - name: Inject validated asset into Deadline Zero workspace
        run: |
          install -D             build/asset-forge-e2e/fulfilled/production-pipeline-icon.svg             deadline-zero/assets/art/production-pipeline-icon.svg
          test -s deadline-zero/assets/art/production-pipeline-icon.svg

      - name: Validate and compile Deadline Zero
        working-directory: deadline-zero
        run: |
          python3 tools/validate_final_sprite_layout.py
          python3 tools/sprites/validate_actor_production_contracts.py
          gradle :core:compileJava :core:test :desktop:compileJava

      - name: Record E2E evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/asset-forge-e2e")
          asset = root / "fulfilled" / "production-pipeline-icon.svg"
          report = json.loads((root / "fulfilled" / "production-report.json").read_text())
          route = json.loads((root / "route.json").read_text())
          evidence = {
              "schema": "ai-dev-server/asset-forge-e2e/v2",
              "route": route,
              "assetForgeReportSuccess": report.get("success") is True,
              "executionMode": "local",
              "crossRepoTokenRequired": False,
              "artifact": str(asset),
              "artifactSha256": hashlib.sha256(asset.read_bytes()).hexdigest(),
              "deadlineZeroCompileAndTests": True,
          }
          assert evidence["assetForgeReportSuccess"]
          (root / "e2e-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-os-asset-forge-deadline-zero-e2e
          path: build/asset-forge-e2e/
          if-no-files-found: error
          retention-days: 14
