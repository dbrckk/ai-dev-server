name: Remote Codespace Control

on:
  push:
    branches: [main]
    paths:
      - control/request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'Missing CODESPACES_PAT'; exit 1; }

      - name: Read request
        id: request
        run: |
          set -euo pipefail
          OP=$(jq -r '.operation // "status"' control/request.json)
          case "$OP" in recreate|rebuild|status|start_services|doctor|logs|codespace_logs) ;; *) exit 1;; esac
          echo "operation=$OP" >> "$GITHUB_OUTPUT"

      - name: Find Codespace
        id: codespace
        run: |
          set -euo pipefail
          NAME=$(gh codespace list --json name,repository --jq ".[] | select(.repository == \"$REPO\") | .name" | head -n1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Recreate Codespace cleanly
        if: steps.request.outputs.operation == 'recreate'
        id: recreate
        run: |
          set -euo pipefail
          OLD='${{ steps.codespace.outputs.name }}'
          [ -z "$OLD" ] || gh codespace delete -c "$OLD" --force
          REPO_ID='${{ github.event.repository.id }}'
          PAYLOAD=$(jq -nc --argjson id "$REPO_ID" '{repository_id:$id,ref:"main",idle_timeout_minutes:30,display_name:"AI Dev Server"}')
          RESPONSE=$(curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' https://api.github.com/user/codespaces -d "$PAYLOAD")
          NEW=$(printf '%s' "$RESPONSE" | jq -r '.name')
          test -n "$NEW" -a "$NEW" != null
          echo "name=$NEW" >> "$GITHUB_OUTPUT"
          echo "Fresh Codespace: $NEW"

      - name: Ensure Codespace is running
        if: steps.request.outputs.operation != 'recreate' && steps.request.outputs.operation != 'rebuild' && steps.request.outputs.operation != 'codespace_logs'
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'; test -n "$NAME"
          STATE=$(gh codespace view -c "$NAME" --json state --jq .state)
          [ "$STATE" = Available ] || curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "https://api.github.com/user/codespaces/$NAME/start" >/dev/null || true
          for i in {1..120}; do STATE=$(gh codespace view -c "$NAME" --json state --jq .state 2>/dev/null || true); [ "$STATE" = Available ] && exit 0; sleep 5; done
          exit 1

      - name: Sync control scripts to Codespace
        if: steps.request.outputs.operation != 'recreate' && steps.request.outputs.operation != 'rebuild' && steps.request.outputs.operation != 'codespace_logs'
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          gh codespace cp -c "$NAME" scripts/start-all.sh remote:/workspaces/ai-dev-server/scripts/start-all.sh
          gh codespace cp -c "$NAME" scripts/status.sh remote:/workspaces/ai-dev-server/scripts/status.sh
          gh codespace cp -c "$NAME" scripts/doctor.sh remote:/workspaces/ai-dev-server/scripts/doctor.sh

      - name: Rebuild Codespace
        if: steps.request.outputs.operation == 'rebuild'
        run: gh codespace rebuild -c '${{ steps.codespace.outputs.name }}' --full

      - name: Read Codespace build logs
        if: steps.request.outputs.operation == 'codespace_logs'
        run: timeout 45s gh codespace logs -c '${{ steps.codespace.outputs.name }}' | tee remote-output.txt || true

      - name: Run remote operation
        if: steps.request.outputs.operation != 'recreate' && steps.request.outputs.operation != 'rebuild' && steps.request.outputs.operation != 'codespace_logs'
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'; OP='${{ steps.request.outputs.operation }}'
          case "$OP" in
            status) CMD='cd /workspaces/ai-dev-server && bash scripts/status.sh' ;;
            start_services) CMD='cd /workspaces/ai-dev-server && bash scripts/start-all.sh && bash scripts/status.sh' ;;
            doctor) CMD='cd /workspaces/ai-dev-server && bash scripts/doctor.sh' ;;
            logs) CMD='for f in "$HOME"/.cache/ai-dev-server/logs/*.log; do echo "===== $f ====="; tail -n 120 "$f"; done' ;;
          esac
          timeout 120s gh codespace ssh -c "$NAME" "$CMD" | tee remote-output.txt

      - name: Persist remote output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f remote-output.txt ] || exit 0
          cp remote-output.txt control/last-output.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/last-output.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record remote Codespace output'
          git push

      - name: Summary
        if: always()
        run: |
          NAME='${{ steps.recreate.outputs.name }}'; [ -n "$NAME" ] || NAME='${{ steps.codespace.outputs.name }}'
          echo "## Remote Codespace Control" >> "$GITHUB_STEP_SUMMARY"
          echo "Operation: ${{ steps.request.outputs.operation }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Codespace: $NAME" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f remote-output.txt ] || { echo '```text' >> "$GITHUB_STEP_SUMMARY"; tail -n 200 remote-output.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; }
