name: Jumpy Autonomous Evolution

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jumpy-autocycle.yml'
      - 'scripts/jumpy-studio-cycle-v2.sh'

permissions:
  contents: read

concurrency:
  group: jumpy-autonomous-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Run autonomous Jumpy studio cycle v2
        run: bash scripts/jumpy-studio-cycle-v2.sh
      - name: Summary
        if: always()
        run: |
          echo '## Jumpy autonomous studio cycle v2' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cadence: every 20 minutes (:07 / :27 / :47).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Control loop: systemic audit → source-derived atomic phase → bounded implementation → Godot validation → living state → validated push.' >> "$GITHUB_STEP_SUMMARY"
