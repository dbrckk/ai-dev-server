name: Jumpy Autonomous Evolution

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jumpy-autocycle.yml'
      - 'scripts/jumpy-studio-cycle-v3.sh'
      - 'scripts/jumpy-studio-cycle-v3-runner.sh'
      - 'scripts/jumpy-studio-cycle-v3-safe.sh'
      - 'docs/EXTERNAL_SOURCE_POLICY.md'

permissions:
  contents: read

concurrency:
  group: jumpy-autonomous-evolution
  cancel-in-progress: true

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable SHA
      - name: Run hardened autonomous Jumpy studio cycle v3
        run: bash scripts/jumpy-studio-cycle-v3-safe.sh
      - name: Summary
        if: always()
        run: |
          echo '## Jumpy autonomous studio cycle v3' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cadence: every 20 minutes (:07 / :27 / :47). Newer cycles supersede stale in-flight cycles.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Security: secret-isolated agent → deterministic known phases → safe no-op handling → strict scope gate → Godot validation → final secret scan → validated push.' >> "$GITHUB_STEP_SUMMARY"
