name: Apply API transport retry patch

on:
  push:
    branches:
      - fix/api-transient-transport-retry
    paths:
      - .github/workflows/apply-api-transport-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/api-transient-transport-retry
          token: ${{ secrets.STUDIO_GITHUB_TOKEN || secrets.CODESPACES_PAT || github.token }}
      - name: Patch core API retry behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('studio/core.py')
          text = path.read_text(encoding='utf-8')
          old = """            except (urllib.error.URLError, TimeoutError, ConnectionError, http.client.HTTPException):\n                raise StudioError('API unavailable or timed out') from None\n"""
          new = """            except (urllib.error.URLError, TimeoutError, ConnectionError, http.client.HTTPException):\n                if method not in ('GET', 'POST') or attempt == 2:\n                    raise StudioError('API unavailable or timed out') from None\n                delay = min(float(2 ** attempt), max(0.0, deadline - time.monotonic()))\n                if delay <= 0:\n                    raise StudioError('API unavailable or timed out') from None\n                time.sleep(delay)\n"""
          if text.count(old) != 1:
              raise SystemExit('expected transport retry block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit production fix
        run: |
          git config user.name dbrckk
          git config user.email 131650085+dbrckk@users.noreply.github.com
          git add studio/core.py
          git diff --cached --check
          git commit -m "fix: retry transient API transport failures"
          git push origin HEAD:fix/api-transient-transport-retry
