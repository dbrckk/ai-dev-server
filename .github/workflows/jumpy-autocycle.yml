name: Jumpy Autonomous Evolution

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jumpy-autocycle.yml'
      - 'scripts/jumpy-studio-cycle-v3.sh'
      - 'scripts/jumpy-studio-cycle-v3-runner.sh'
      - 'scripts/jumpy-studio-cycle-v3-safe.sh'
      - 'scripts/jumpy-studio-cycle-v4.sh'
      - 'scripts/jumpy-studio-cycle-v5.sh'
      - 'scripts/jumpy-studio-cycle-v6.sh'
      - 'scripts/jumpy-studio-cycle-v7.sh'
      - 'scripts/fcc-agent-benchmark.sh'
      - 'docs/EXTERNAL_SOURCE_POLICY.md'

permissions:
  contents: read

concurrency:
  group: jumpy-autonomous-evolution
  cancel-in-progress: true

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run hardened autonomous Jumpy studio cycle v7
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        run: bash scripts/jumpy-studio-cycle-v7.sh
      - name: Summary
        if: always()
        run: |
          echo '## Jumpy autonomous studio cycle v7' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cadence: every 20 minutes (:07 / :27 / :47), best effort.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Agent routing: FCC health probe → client-compatible FCC catalog routing → empirical file-edit benchmark → productive agent → validated deterministic fallback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Security: no provider/GitHub secrets passed to coding agents; strict scope, secret scan and Godot validation precede deterministic pushes.' >> "$GITHUB_STEP_SUMMARY"
