version: 2.1

jobs:
  docker_info:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run: docker version
  flutter_image:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run: docker pull ghcr.io/cirruslabs/flutter:3.44.0@sha256:0a9de3b70b5b7b921a346eb2793e363dc22280849a4fd690d9dde99ce1c2b1b8
  smoke:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          no_output_timeout: 30m
          command: python3 studio/smoke.py

workflows:
  diagnose-smoke:
    jobs:
      - docker_info
      - flutter_image
      - smoke
