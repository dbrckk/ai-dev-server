name: Jumpy Autonomous Evolution

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jumpy-autocycle.yml'
      - 'scripts/jumpy-studio-cycle.sh'

permissions:
  contents: read

concurrency:
  group: jumpy-autonomous-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Run autonomous Jumpy studio cycle
        run: bash scripts/jumpy-studio-cycle.sh
      - name: Summary
        if: always()
        run: |
          echo '## Jumpy autonomous studio cycle' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cadence: every 30 minutes (:15 / :45).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Control loop: multidisciplinary audit → adaptive priority → implementation → Godot validation → living plan/state update → validated push.' >> "$GITHUB_STEP_SUMMARY"
