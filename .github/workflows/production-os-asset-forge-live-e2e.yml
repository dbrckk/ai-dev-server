name: Production OS Asset Forge Live E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-os-asset-forge-live-e2e.yml'
      - 'tests/test_production_os_asset_forge_live_e2e_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-os-asset-forge-live-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ASSET_FORGE_REPO: dbrckk/asset-forge
      GH_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN || secrets.CODESPACES_PAT }}
    steps:
      - name: Checkout AI Dev Server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout current Asset Forge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dbrckk/asset-forge
          path: asset-forge
          persist-credentials: false

      - name: Checkout Deadline Zero
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dbrckk/deadline-zero
          path: deadline-zero
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'

      - name: Validate cross-repository dispatch access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::STUDIO_GITHUB_TOKEN or CODESPACES_PAT is required for Asset Forge dispatch."
            exit 2
          fi
          gh api "repos/$ASSET_FORGE_REPO" --jq '.full_name' | grep -Fx "$ASSET_FORGE_REPO"

      - name: Materialize Production OS live visual handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/live-e2e
          PYTHONPATH="$GITHUB_WORKSPACE/studio" python - <<'PY'
          import json
          from pathlib import Path
          from core import request_check
          from production_os_worker import build_studio_request

          job = {
              "key": "deadline-zero-live-visual-e2e",
              "repository": "dbrckk/deadline-zero",
              "task": "Generate and integrate a live secondary Deadline Zero UI icon",
              "payload": {
                  "workflow_id": "asset-forge-live-e2e",
                  "workflow_task_id": "deadline-zero-live-secondary-icon",
                  "handoff": {
                      "repository": "dbrckk/deadline-zero",
                      "task": "Generate and integrate a live secondary Deadline Zero UI icon",
                      "final_goal": "Prove the live AI visual generation path through Production OS, AI Dev Server, Asset Forge, and Deadline Zero.",
                      "agent_preference": "codex",
                      "token_budget": 50000,
                      "tool_contracts": {
                          "asset_forge": {
                              "request_schema": "asset-forge/production-request/v1",
                              "report_schema": "asset-forge/remote-batch-result/v1",
                              "command": "asset-forge remote batch",
                              "required_capability": "visual-asset-production"
                          }
                      }
                  }
              }
          }
          request = request_check(build_studio_request(job))
          assert request["tool_contracts"]["asset_forge"]["required_capability"] == "visual-asset-production"
          Path("build/live-e2e/studio-request.json").write_text(
              json.dumps(request, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create remote Asset Forge batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          request = {
              "schema": "asset-forge/production-request/v1",
              "requestId": "deadline-zero-live-secondary-icon",
              "instruction": "Create a premium dark sci-fi game UI icon for Deadline Zero representing an autonomous production pipeline: one strong geometric forge/core symbol, high contrast silhouette, subtle industrial cyberpunk character, no text, no letters, no watermark, no mockup background.",
              "manifest": {
                  "schema": "asset-forge/manifest/v1",
                  "id": "live-production-pipeline-icon",
                  "project": "deadline-zero",
                  "type": "sprite",
                  "importance": "secondary",
                  "source": {"mode": "generated"},
                  "license": {
                      "id": "project-owned",
                      "commercialUse": True,
                      "derivatives": True,
                      "attributionRequired": False,
                  },
                  "target": {
                      "engine": "libgdx",
                      "format": "png",
                      "maxBytes": 4194304,
                  },
                  "constraints": {
                      "frameWidth": 96,
                      "frameHeight": 96,
                      "expectedFrames": 1,
                  },
              },
          }
          spec = {
              "items": [{
                  "id": "live-production-pipeline-icon",
                  "request": request,
                  "target_path": "assets/art/live-production-pipeline-icon.png",
              }]
          }
          Path("build/live-e2e/batch-spec.json").write_text(
              json.dumps(spec, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch Asset Forge production
        id: asset_forge
        shell: bash
        run: |
          set -euo pipefail
          correlation="production-os-live-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          spec_json="$(python -c 'import json; print(json.dumps(json.load(open("build/live-e2e/batch-spec.json")), separators=(",", ":")))' )"

          gh workflow run production-os-batch.yml             --repo "$ASSET_FORGE_REPO"             --ref main             -f correlation_id="$correlation"             -f spec_json="$spec_json"             -f backend=auto

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(
              gh run list                 --repo "$ASSET_FORGE_REPO"                 --workflow production-os-batch.yml                 --event workflow_dispatch                 --limit 20                 --json databaseId,displayTitle                 --jq ".[] | select(.displayTitle == \"Asset Forge batch $correlation\") | .databaseId"               | head -n 1
            )"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "::error::Unable to locate dispatched Asset Forge workflow run."
            exit 2
          fi

          local_sha="$(git -C asset-forge rev-parse HEAD)"
          remote_sha="$(gh run view "$run_id" --repo "$ASSET_FORGE_REPO" --json headSha --jq '.headSha')"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "::error::Asset Forge main advanced during dispatch; rerun to keep E2E evidence exact."
            echo "local=$local_sha remote=$remote_sha"
            exit 2
          fi

          echo "correlation=$correlation" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "asset_forge_sha=$remote_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for remote Asset Forge production
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.asset_forge.outputs.run_id }}"             --repo "$ASSET_FORGE_REPO"             --exit-status             --interval 10

      - name: Download validated Asset Forge bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/live-e2e/remote
          gh run download "${{ steps.asset_forge.outputs.run_id }}"             --repo "$ASSET_FORGE_REPO"             --name "asset-forge-batch-${{ steps.asset_forge.outputs.correlation }}"             --dir build/live-e2e/remote

      - name: Verify remote bundle and materialize asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/live-e2e/fulfilled
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path("build/live-e2e/remote").resolve()
          result_path = root / "batch-result.json"
          assert result_path.is_file(), result_path
          result = json.loads(result_path.read_text(encoding="utf-8"))
          assert result["schema_version"] == "asset-forge/remote-batch-result/v1", result
          assert result["success"] is True, result
          assert result["count"] == 1, result
          assert result["execution_order"] == ["live-production-pipeline-icon"], result

          item = result["items"][0]
          assert item["id"] == "live-production-pipeline-icon", item
          artifact = (root / item["artifact"]).resolve()
          assert artifact.is_relative_to(root), artifact
          assert artifact.is_file() and artifact.stat().st_size > 0, artifact
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert digest == item["sha256"], (digest, item["sha256"])

          destination = Path("build/live-e2e/fulfilled/live-production-pipeline-icon.png")
          shutil.copyfile(artifact, destination)
          (Path("build/live-e2e") / "remote-batch-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Inject live asset into Deadline Zero workspace
        run: |
          install -D             build/live-e2e/fulfilled/live-production-pipeline-icon.png             deadline-zero/assets/art/live-production-pipeline-icon.png
          test -s deadline-zero/assets/art/live-production-pipeline-icon.png

      - name: Validate Deadline Zero art contracts
        working-directory: deadline-zero
        run: |
          python3 tools/validate_final_sprite_layout.py
          python3 tools/sprites/validate_actor_production_contracts.py

      - name: Compile and test Deadline Zero with live asset
        working-directory: deadline-zero
        run: gradle :core:compileJava :core:test :desktop:compileJava

      - name: Record live E2E evidence
        env:
          ASSET_FORGE_RUN_ID: ${{ steps.asset_forge.outputs.run_id }}
          ASSET_FORGE_SHA: ${{ steps.asset_forge.outputs.asset_forge_sha }}
          ASSET_FORGE_CORRELATION: ${{ steps.asset_forge.outputs.correlation }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("build/live-e2e")
          asset = root / "fulfilled" / "live-production-pipeline-icon.png"
          batch = json.loads((root / "remote-batch-result.json").read_text())
          studio = json.loads((root / "studio-request.json").read_text())
          evidence = {
              "schema": "ai-dev-server/asset-forge-live-e2e/v2",
              "productionOsCorrelation": studio["production_os"],
              "targetRepo": studio["target_repo"],
              "toolContract": studio["tool_contracts"]["asset_forge"],
              "assetForgeRemoteRunId": int(os.environ["ASSET_FORGE_RUN_ID"]),
              "assetForgeSha": os.environ["ASSET_FORGE_SHA"],
              "assetForgeCorrelation": os.environ["ASSET_FORGE_CORRELATION"],
              "assetForgeBatchSuccess": batch.get("success") is True,
              "assetForgeRouting": batch.get("routing_summary"),
              "liveGeneration": True,
              "artifact": str(asset),
              "artifactSha256": hashlib.sha256(asset.read_bytes()).hexdigest(),
              "deadlineZeroCompileAndTests": True,
          }
          assert evidence["assetForgeBatchSuccess"]
          (root / "e2e-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload live E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-os-asset-forge-live-deadline-zero-e2e
          path: build/live-e2e/
          if-no-files-found: error
          retention-days: 14
