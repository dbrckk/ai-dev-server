name: Autonomous Mobile Studio
on:
  push:
    branches: [main]
    paths: ['control/mobile-requests/*.json', 'control/ci.json']
  workflow_dispatch:
  schedule:
    - cron: '3,23,43 * * * *'
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      projects: ${{ steps.queue.outputs.projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: queue
        run: echo "projects=$(python studio/queue.py --provider github)" >> "$GITHUB_OUTPUT"
  create:
    needs: queue
    if: needs.queue.outputs.projects != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: ${{ fromJSON(needs.queue.outputs.projects) }}
    concurrency:
      group: mobile-studio-${{ matrix.project.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bootstrap Android device-QA runtime
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator"
          command -v adb
          command -v sdkmanager
          command -v avdmanager
          command -v emulator
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          emulator -accel-check
      - name: Run full autonomous completion pipeline
        env:
          STUDIO_CI_PROVIDER: github
          STUDIO_REQUEST: ${{ matrix.project.file }}
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN || secrets.CODESPACES_PAT }}
          STUDIO_API_KEY: ${{ secrets.STUDIO_API_KEY || secrets.NVIDIA_NIM_API_KEY }}
          STUDIO_API_BASE: ${{ vars.STUDIO_API_BASE || 'https://integrate.api.nvidia.com/v1' }}
          STUDIO_MODEL: ${{ vars.STUDIO_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
          STUDIO_CODE_MODEL: ${{ vars.STUDIO_CODE_MODEL }}
          STUDIO_VISION_MODEL: ${{ vars.STUDIO_VISION_MODEL }}
        run: python studio/github_runner.py "$STUDIO_REQUEST"
      - name: Retain reports, release packages and trusted QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-${{ matrix.project.id }}-${{ github.run_number }}
          path: studio-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for name in (
                  'github-pipeline.json', 'report.json', 'evolution-request.json',
                  'evolution-work-order.json', 'evolution-pending.json', 'evolution-pending-error.json',
                  'evolution-research.json', 'evolution-research-provenance.json', 'evolution-research-error.json',
                  'evolution-candidate.json', 'evolution-isolated-benchmark.json',
                  'evolution-promotion.json', 'evolution-applied.json',
                  'evolution-persisted.json', 'evolution-persist-error.json',
                  'evolution-apply-error.json', 'github-pipeline-error.json', 'error.json'):
                  p = Path('studio-output') / name
                  if p.exists():
                      d = json.loads(p.read_text())
                      out.write(name + ': ' + str(d.get('status', 'available')) + '\n')
                      if d.get('next_stage'): out.write('Next stage: ' + str(d['next_stage']) + '\n')
                      for key in ('pending_status','research_status','synthesis_status','benchmark_status','promotion_status','persistence_status'):
                          if d.get(key): out.write(key + ': ' + str(d[key]) + '\n')
                      if d.get('pull_request'): out.write('Promotion PR: #' + str(d['pull_request']) + '\n')
              out.write('Download the artifact for release packages and trusted QA/evolution evidence.\n')
          PY
