version: 2.1

parameters:
  mode:
    type: enum
    enum: ["queue", "preview", "smoke"]
    default: "smoke"

jobs:
  test_ci:
    docker: [{image: cimg/python:3.12.11}]
    steps:
      - checkout
      - run: python tests/test_ci.py -v
  test_stage_registry:
    docker: [{image: cimg/python:3.12.11}]
    steps:
      - checkout
      - run: python tests/test_stage_registry.py -v
  test_completion:
    docker: [{image: cimg/python:3.12.11}]
    steps:
      - checkout
      - run: python tests/test_completion.py -v
  test_other:
    docker: [{image: cimg/python:3.12.11}]
    steps:
      - checkout
      - run:
          command: |
            set -e
            for test in tests/test_*.py; do
              case "$test" in
                tests/test_ci.py|tests/test_stage_registry.py|tests/test_completion.py) continue ;;
              esac
              python "$test" -v
            done

workflows:
  diagnose:
    jobs:
      - test_ci
      - test_stage_registry
      - test_completion
      - test_other
