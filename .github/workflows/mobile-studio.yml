name: Autonomous Mobile Studio
on:
  push:
    branches: [main]
    paths: ['control/mobile-requests/*.json', 'control/ci.json', 'control/promoted_stages.json']
  workflow_dispatch:
  schedule:
    - cron: '3,23,43 * * * *'
permissions:
  contents: read
  actions: read
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      projects: ${{ steps.queue.outputs.projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: terminal
        name: Read terminal autonomous goal ids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          from studio.goal_engine import validate as validate_goal
          from studio.improvement_backlog import validate as validate_backlog

          repo=os.environ['GITHUB_REPOSITORY']
          headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
          }

          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)

          tree_url='https://api.github.com/repos/'+repo+'/git/trees/studio-autonomy-state?recursive=1'
          try:
              data=get_json(tree_url)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  data={'tree':[]}
              else:
                  raise

          if not isinstance(data,dict) or data.get('truncated') or not isinstance(data.get('tree'),list):
              raise RuntimeError('Autonomous state tree is invalid or truncated')

          blobs={}
          for item in data['tree']:
              if isinstance(item,dict) and item.get('type')=='blob' and isinstance(item.get('path'),str):
                  blobs[item['path']]=item

          def read_blob(path, validator):
              item=blobs.get(path)
              if item is None:
                  return None
              sha=item.get('sha')
              if not isinstance(sha,str) or len(sha)!=40:
                  raise RuntimeError('Autonomous state blob identity is invalid')
              blob=get_json('https://api.github.com/repos/'+repo+'/git/blobs/'+sha)
              if not isinstance(blob,dict) or blob.get('encoding')!='base64':
                  raise RuntimeError('Autonomous state blob is invalid')
              raw=base64.b64decode(blob.get('content',''),validate=False)
              if len(raw)>512*1024:
                  raise RuntimeError('Autonomous state blob is too large')
              return validator(json.loads(raw.decode('utf-8')))

          terminal=[]
          for path in sorted(blobs):
              if not (path.startswith('.studio-autonomy/') and path.endswith('/goal.json')):
                  continue
              parts=path.split('/')
              if len(parts)!=3:
                  raise RuntimeError('Autonomous goal path is invalid')
              project_id=parts[1]
              goal=read_blob(path,validate_goal)
              if goal['status']=='blocked':
                  terminal.append(project_id)
                  continue
              if goal['status']!='complete':
                  continue
              backlog=read_blob(
                  '.studio-autonomy/'+project_id+'/improvement-backlog.json',
                  validate_backlog,
              )
              pending=False
              if backlog is not None:
                  pending=any(item['status'] in {'queued','active'} for item in backlog['items'])
              if not pending:
                  terminal.append(project_id)

          encoded=json.dumps(sorted(set(terminal)),separators=(',',':'))
          print('ids='+encoded)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('ids='+encoded+'\n')
          PY
      - id: queue
        env:
          TERMINAL_IDS: ${{ steps.terminal.outputs.ids }}
        run: echo "projects=$(python studio/queue.py --provider github --terminal-ids-json "$TERMINAL_IDS")" >> "$GITHUB_OUTPUT"
  create:
    needs: queue
    if: needs.queue.outputs.projects != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: ${{ fromJSON(needs.queue.outputs.projects) }}
    concurrency:
      group: mobile-studio-${{ matrix.project.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bootstrap Android device-QA runtime
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator"
          command -v adb
          command -v sdkmanager
          command -v avdmanager
          command -v emulator
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          emulator -accel-check
      - name: Install autonomous coding agent
        run: npm install -g opencode-ai

      - name: Run full autonomous completion pipeline
        env:
          STUDIO_CI_PROVIDER: github
          STUDIO_REQUEST: ${{ matrix.project.file }}
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN || secrets.CODESPACES_PAT }}
          STUDIO_API_KEY: ${{ secrets.STUDIO_API_KEY || secrets.NVIDIA_NIM_API_KEY }}
          STUDIO_API_BASE: ${{ vars.STUDIO_API_BASE || 'https://integrate.api.nvidia.com/v1' }}
          STUDIO_MODEL: ${{ vars.STUDIO_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
          STUDIO_CODE_MODEL: ${{ vars.STUDIO_CODE_MODEL }}
          STUDIO_VISION_MODEL: ${{ vars.STUDIO_VISION_MODEL }}
        run: python studio/github_runner.py "$STUDIO_REQUEST"
      - name: Retain reports, release packages and trusted QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-${{ matrix.project.id }}-${{ github.run_number }}
          path: studio-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for name in (
                  'github-pipeline.json', 'report.json', 'evolution-request.json',
                  'evolution-work-order.json', 'evolution-pending.json', 'evolution-pending-error.json',
                  'evolution-research.json', 'evolution-research-provenance.json', 'evolution-research-error.json',
                  'evolution-candidate.json', 'evolution-isolated-benchmark.json',
                  'evolution-promotion.json', 'evolution-applied.json',
                  'evolution-persisted.json', 'evolution-persist-error.json',
                  'evolution-automerge.json', 'evolution-automerge-error.json',
                  'evolution-apply-error.json', 'github-pipeline-error.json', 'error.json'):
                  p = Path('studio-output') / name
                  if p.exists():
                      d = json.loads(p.read_text())
                      out.write(name + ': ' + str(d.get('status', 'available')) + '\n')
                      if d.get('next_stage'): out.write('Next stage: ' + str(d['next_stage']) + '\n')
                      for key in ('pending_status','research_status','synthesis_status','benchmark_status','promotion_status','persistence_status','automerge_status'):
                          if d.get(key): out.write(key + ': ' + str(d[key]) + '\n')
                      if d.get('pull_request'): out.write('Promotion PR: #' + str(d['pull_request']) + '\n')
              request = Path('studio-output/USER_INPUT_REQUIRED.txt')
              if request.exists():
                  out.write('\n### User input required\n\n')
                  out.write(request.read_text()[:8000] + '\n')
              out.write('Download the artifact for release packages and trusted QA/evolution evidence.\n')
          PY
