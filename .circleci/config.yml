version: 2.1

jobs:
  visual_full:
    machine: {image: ubuntu-2404:current}
    resource_class: large
    steps: [checkout, {run: "python3 studio/smoke_probe.py visual"}]
  visual_no_guidelines:
    machine: {image: ubuntu-2404:current}
    resource_class: large
    steps: [checkout, {run: "python3 studio/smoke_probe.py visual_no_guidelines"}]

workflows:
  diagnose-guidelines:
    jobs:
      - visual_full
      - visual_no_guidelines
