name: Remote Codespace Control

on:
  push:
    branches: [main]
    paths:
      - control/request.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'Missing CODESPACES_PAT'; exit 1; }

      - name: Read request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          OP=$(jq -r '.operation // "status"' control/request.json)
          case "$OP" in
            recreate|rebuild|status|start_services|doctor|logs|codespace_logs) ;;
            *) echo "Unsupported operation: $OP"; exit 1 ;;
          esac
          echo "operation=$OP" >> "$GITHUB_OUTPUT"

      - name: Find Codespace
        id: codespace
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(gh codespace list --json name,repository,state --jq ".[] | select(.repository == \"$REPO\") | .name" | head -n1)
          if [ -n "$NAME" ]; then
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
            echo "Codespace: $NAME"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "No existing Codespace found"
          fi

      - name: Recreate Codespace cleanly
        if: steps.request.outputs.operation == 'recreate'
        id: recreate
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          if [ -n "$NAME" ]; then
            echo "Deleting stale Codespace: $NAME"
            gh codespace delete -c "$NAME" --force
            for i in {1..30}; do
              if ! gh codespace view -c "$NAME" >/dev/null 2>&1; then break; fi
              sleep 2
            done
          fi
          echo "Creating fresh Codespace from $REPO@main"
          NEW_NAME=$(gh codespace create -R "$REPO" -b main --idle-timeout 30m --display-name "AI Dev Server" --json name --jq .name)
          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "Fresh Codespace: $NEW_NAME"

      - name: Ensure Codespace is running
        if: steps.request.outputs.operation != 'recreate' && steps.request.outputs.operation != 'rebuild' && steps.request.outputs.operation != 'codespace_logs'
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          test -n "$NAME" || { echo 'No Codespace found'; exit 1; }
          STATE=$(gh codespace view -c "$NAME" --json state --jq .state)
          echo "Current state: $STATE"
          case "$STATE" in
            Available) ;;
            Rebuilding|Starting|Provisioning|Creating|Updating)
              echo "Codespace is transitioning; waiting for Available..."
              ;;
            *)
              curl -sS -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/user/codespaces/$NAME/start" >/dev/null || true
              ;;
          esac
          if [ "$STATE" != "Available" ]; then
            for i in {1..120}; do
              STATE=$(gh codespace view -c "$NAME" --json state --jq .state 2>/dev/null || true)
              echo "State: $STATE"
              [ "$STATE" = "Available" ] && break
              sleep 5
            done
            [ "$STATE" = "Available" ] || { echo "Codespace did not become available"; exit 1; }
          fi

      - name: Rebuild Codespace
        if: steps.request.outputs.operation == 'rebuild'
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          test -n "$NAME" || { echo 'No Codespace found'; exit 1; }
          gh codespace rebuild -c "$NAME" --full

      - name: Read Codespace build logs
        if: steps.request.outputs.operation == 'codespace_logs'
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          test -n "$NAME" || { echo 'No Codespace found'; exit 1; }
          timeout 45s gh codespace logs -c "$NAME" | tee remote-output.txt || true

      - name: Run remote operation
        if: steps.request.outputs.operation != 'recreate' && steps.request.outputs.operation != 'rebuild' && steps.request.outputs.operation != 'codespace_logs'
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          OP='${{ steps.request.outputs.operation }}'
          case "$OP" in
            status) CMD='cd /workspaces/ai-dev-server && bash scripts/status.sh' ;;
            start_services) CMD='cd /workspaces/ai-dev-server && git pull --ff-only && bash scripts/start-all.sh && bash scripts/status.sh' ;;
            doctor) CMD='cd /workspaces/ai-dev-server && git pull --ff-only && bash scripts/doctor.sh' ;;
            logs) CMD='for f in "$HOME"/.cache/ai-dev-server/logs/*.log; do echo "===== $f ====="; tail -n 120 "$f"; done' ;;
          esac
          gh codespace ssh -c "$NAME" "$CMD" | tee remote-output.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          FINAL_NAME='${{ steps.recreate.outputs.name }}'
          [ -n "$FINAL_NAME" ] || FINAL_NAME='${{ steps.codespace.outputs.name }}'
          {
            echo '## Remote Codespace Control'
            echo
            echo "Operation: ${{ steps.request.outputs.operation }}"
            echo "Codespace: $FINAL_NAME"
            if [ -f remote-output.txt ]; then
              echo
              echo '```text'
              tail -n 200 remote-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
