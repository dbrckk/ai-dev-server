name: Remote Codespace Control

on:
  push:
    branches: [main]
    paths:
      - control/request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'Missing CODESPACES_PAT'; exit 1; }

      - name: Read request
        id: request
        run: |
          set -euo pipefail
          OP=$(jq -r '.operation // "status"' control/request.json)
          case "$OP" in recreate|rebuild|status|start_services|restart_services|doctor|provider_status|configure_nvidia|agent_test|configure_cdesktop|logs|codespace_logs) ;; *) exit 1;; esac
          echo "operation=$OP" >> "$GITHUB_OUTPUT"

      - name: Find Codespace
        id: codespace
        run: |
          set -euo pipefail
          NAME=$(gh codespace list --json name,repository --jq ".[] | select(.repository == \"$REPO\") | .name" | head -n1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Recreate Codespace cleanly
        if: steps.request.outputs.operation == 'recreate'
        id: recreate
        run: |
          set -euo pipefail
          OLD='${{ steps.codespace.outputs.name }}'
          [ -z "$OLD" ] || gh codespace delete -c "$OLD" --force
          REPO_ID='${{ github.event.repository.id }}'
          PAYLOAD=$(jq -nc --argjson id "$REPO_ID" '{repository_id:$id,ref:"main",idle_timeout_minutes:30,display_name:"AI Dev Server"}')
          RESPONSE=$(curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' https://api.github.com/user/codespaces -d "$PAYLOAD")
          NEW=$(printf '%s' "$RESPONSE" | jq -r '.name')
          test -n "$NEW" -a "$NEW" != null
          echo "name=$NEW" >> "$GITHUB_OUTPUT"
          echo "Fresh Codespace: $NEW"

      - name: Ensure Codespace is running
        if: steps.request.outputs.operation != 'recreate' && steps.request.outputs.operation != 'rebuild' && steps.request.outputs.operation != 'codespace_logs'
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'; test -n "$NAME"
          STATE=$(gh codespace view -c "$NAME" --json state --jq .state)
          [ "$STATE" = Available ] || curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "https://api.github.com/user/codespaces/$NAME/start" >/dev/null || true
          for i in {1..120}; do STATE=$(gh codespace view -c "$NAME" --json state --jq .state 2>/dev/null || true); [ "$STATE" = Available ] && exit 0; sleep 5; done
          exit 1

      - name: Sync control scripts to Codespace
        if: steps.request.outputs.operation != 'recreate' && steps.request.outputs.operation != 'rebuild' && steps.request.outputs.operation != 'codespace_logs'
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          DATA=$(tar -czf - scripts/start-all.sh scripts/restart-all.sh scripts/status.sh scripts/doctor.sh scripts/provider-status.sh scripts/agent-test.sh scripts/configure-cdesktop.sh | base64 -w0)
          timeout 60s gh codespace ssh -c "$NAME" "printf '%s' '$DATA' | base64 -d | tar -xzf - -C /workspaces/ai-dev-server"

      - name: Rebuild Codespace
        if: steps.request.outputs.operation == 'rebuild'
        run: gh codespace rebuild -c '${{ steps.codespace.outputs.name }}' --full

      - name: Read Codespace build logs
        if: steps.request.outputs.operation == 'codespace_logs'
        run: timeout 45s gh codespace logs -c '${{ steps.codespace.outputs.name }}' | tee remote-output.txt || true

      - name: Configure NVIDIA NIM securely
        if: steps.request.outputs.operation == 'configure_nvidia'
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NVIDIA_NIM_API_KEY:-}" || { echo 'Missing repository secret: NVIDIA_NIM_API_KEY'; exit 1; }
          NAME='${{ steps.codespace.outputs.name }}'
          PAYLOAD=$(jq -nc --arg key "$NVIDIA_NIM_API_KEY" '{values:{NVIDIA_NIM_API_KEY:$key,MODEL:"nvidia_nim/nvidia/nemotron-3-super-120b-a12b"}}')
          DATA=$(printf '%s' "$PAYLOAD" | base64 -w0)
          CMD="set -e; printf '%s' '$DATA' | base64 -d > /tmp/fcc-provider.json; curl -fsS -H 'Content-Type: application/json' -X POST http://127.0.0.1:8082/admin/api/config/apply --data-binary @/tmp/fcc-provider.json >/tmp/fcc-apply.json; rm -f /tmp/fcc-provider.json; python -c \"import json; d=json.load(open('/tmp/fcc-apply.json')); print('nvidia_configuration: applied' if d.get('applied') else 'nvidia_configuration: failed')\"; rm -f /tmp/fcc-apply.json; curl -sS -X POST http://127.0.0.1:8082/admin/api/providers/nvidia_nim/test | python -c \"import json,sys; d=json.load(sys.stdin); print('nvidia_provider_test:', 'OK' if d.get('ok') else 'FAILED')\""
          timeout 120s gh codespace ssh -c "$NAME" "$CMD" | tee remote-output.txt

      - name: Run remote operation
        if: steps.request.outputs.operation != 'recreate' && steps.request.outputs.operation != 'rebuild' && steps.request.outputs.operation != 'codespace_logs' && steps.request.outputs.operation != 'configure_nvidia'
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'; OP='${{ steps.request.outputs.operation }}'
          case "$OP" in
            status) CMD='cd /workspaces/ai-dev-server && bash scripts/status.sh' ;;
            start_services) CMD='cd /workspaces/ai-dev-server && bash scripts/start-all.sh && bash scripts/status.sh' ;;
            restart_services) CMD='cd /workspaces/ai-dev-server && bash scripts/restart-all.sh && bash scripts/status.sh' ;;
            doctor) CMD='cd /workspaces/ai-dev-server && bash scripts/doctor.sh' ;;
            provider_status) CMD='cd /workspaces/ai-dev-server && bash scripts/provider-status.sh' ;;
            agent_test) CMD='cd /workspaces/ai-dev-server && bash scripts/agent-test.sh' ;;
            configure_cdesktop) CMD='cd /workspaces/ai-dev-server && bash scripts/configure-cdesktop.sh' ;;
            logs) CMD='for f in "$HOME"/.cache/ai-dev-server/logs/*.log; do echo "===== $f ====="; tail -n 120 "$f"; done' ;;
          esac
          timeout 300s gh codespace ssh -c "$NAME" "$CMD" | tee remote-output.txt

      - name: Sanitize remote output
        if: always()
        run: |
          [ -f remote-output.txt ] || exit 0
          sed -E 's/(\?token=)[A-Za-z0-9._~-]+/\1[REDACTED]/g; s/(ghu_)[A-Za-z0-9]+/\1[REDACTED]/g; s/(github_pat_)[A-Za-z0-9_]+/\1[REDACTED]/g; s/(nvapi-)[A-Za-z0-9._~-]+/\1[REDACTED]/g' remote-output.txt > safe-output.txt

      - name: Persist remote output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f safe-output.txt ] || exit 0
          cp safe-output.txt control/last-output.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/last-output.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record sanitized remote Codespace output'
          git push

      - name: Summary
        if: always()
        run: |
          NAME='${{ steps.recreate.outputs.name }}'; [ -n "$NAME" ] || NAME='${{ steps.codespace.outputs.name }}'
          echo "## Remote Codespace Control" >> "$GITHUB_STEP_SUMMARY"
          echo "Operation: ${{ steps.request.outputs.operation }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Codespace: $NAME" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f safe-output.txt ] || { echo '```text' >> "$GITHUB_STEP_SUMMARY"; tail -n 200 safe-output.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; }
