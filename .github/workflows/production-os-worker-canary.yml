name: Production-OS Worker Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/production-os-worker-canary.json'

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: production-os-worker-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCTION_OS_URL: https://production-os-control-plane.onrender.com
      PYTHONPATH: studio
      PRODUCTION_OS_CANARY_DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted canary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # Render Free may be asleep: the OIDC exchange has a short HTTP
      # timeout and must not be the first request that wakes the instance.
      # Read-only /readyz also verifies the existing PostgreSQL connection.
      - name: Wait for Render and PostgreSQL readiness before OIDC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ["PRODUCTION_OS_URL"].strip().rstrip("/")
          parsed = urllib.parse.urlsplit(base)
          if (parsed.scheme != "https" or not parsed.netloc
                  or parsed.username or parsed.password or parsed.query
                  or parsed.fragment or parsed.path not in {"", "/"}):
              raise SystemExit("Production-OS readiness requires a simple HTTPS origin")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          reason = "unreachable"
          # 24 bounded probes tolerate cold Render and cold Neon without
          # retrying any authenticated POST or launching a job twice.
          for attempt in range(1, 25):
              try:
                  request = urllib.request.Request(
                      base + "/readyz", headers={"Accept": "application/json"},
                  )
                  with opener.open(request, timeout=5) as response:
                      raw = response.read(8193)
                      if len(raw) > 8192:
                          raise ValueError("readiness response too large")
                      data = json.loads(raw.decode("utf-8"))
                      if (response.status == 200 and isinstance(data, dict)
                              and data.get("status") == "ready"
                              and data.get("database") == "reachable"):
                          print(f"Production-OS ready before OIDC (attempt {attempt})")
                          break
                      reason = "not_ready"
              except urllib.error.HTTPError as exc:
                  reason = "http_" + str(exc.code)
              except (urllib.error.URLError, TimeoutError, OSError,
                      ValueError, UnicodeError):
                  reason = "transport_or_invalid_response"
              if attempt != 24:
                  time.sleep(5)
          else:
              raise SystemExit("Production-OS readiness unavailable before OIDC: " + reason)
          PY

      # Canary requires an operator credential and a narrower read-only worker
      # role check. Both sessions are short-lived; neither secret is stored.
      - name: Exchange GitHub OIDC for scoped operator token
        run: python studio/production_os_oidc.py operator

      - name: Exchange GitHub OIDC for scoped worker token
        run: python studio/production_os_oidc.py worker

      # The control plane may already dispatch a worker while queueing. This
      # workflow_dispatch is a fallback only when no worker was woken.
      - name: Launch and verify real Production-OS worker canary
        run: >-
          python studio/production_os_worker_canary.py
          control/production-os-worker-canary.json
          --wait-seconds 1800
          --poll-seconds 10
