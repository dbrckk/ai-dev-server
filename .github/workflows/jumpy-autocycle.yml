name: Jumpy Autonomous Evolution

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jumpy-autocycle.yml'

permissions:
  contents: read

concurrency:
  group: jumpy-autonomous-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
      INFRA_REPO: dbrckk/ai-dev-server
      GAME_REPO: dbrckk/Jumpy

    steps:
      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'Missing CODESPACES_PAT'; exit 1; }

      - name: Find and wake AI Codespace
        id: codespace
        run: |
          set -euo pipefail
          NAME=$(gh codespace list --json name,repository --jq ".[] | select(.repository == \"$INFRA_REPO\") | .name" | head -n1)
          test -n "$NAME" || { echo 'No ai-dev-server Codespace found'; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          STATE=$(gh codespace view -c "$NAME" --json state --jq .state)
          if [ "$STATE" != Available ]; then
            curl -fsSL -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/user/codespaces/$NAME/start" >/dev/null || true
          fi
          for i in {1..120}; do
            STATE=$(gh codespace view -c "$NAME" --json state --jq .state 2>/dev/null || true)
            [ "$STATE" = Available ] && exit 0
            sleep 5
          done
          echo 'Codespace did not become available'
          exit 1

      - name: Full-team strategic review and implementation
        id: patch
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'

          cat > /tmp/remote-cycle.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          BASE="$HOME/.cache/ai-dev-server"
          mkdir -p "$BASE/logs"

          if ! curl -fsS --max-time 3 http://127.0.0.1:8082/health >/dev/null 2>&1; then
            nohup fcc-server >"$BASE/logs/fcc.log" 2>&1 < /dev/null &
            for i in {1..30}; do
              curl -fsS --max-time 2 http://127.0.0.1:8082/health >/dev/null 2>&1 && break
              sleep 1
            done
          fi
          curl -fsS --max-time 3 http://127.0.0.1:8082/health >/dev/null

          WORK=/tmp/jumpy-autocycle
          rm -rf "$WORK"
          git clone --depth 1 https://github.com/dbrckk/Jumpy.git "$WORK" >/dev/null 2>&1
          cd "$WORK"

          CONTEXT=$(python - <<'PY'
          from pathlib import Path
          files=[
              'docs/AUTONOMOUS_TEAM.md','docs/AUTONOMOUS_STATE.md','docs/PRODUCTION_ROADMAP.md',
              'docs/GAME_DESIGN.md','SETUP_REQUIRED.txt','README.md','project.godot',
              'scripts/main.gd','scripts/profile.gd','scripts/integrations.gd','assets/ui/theme.tres'
          ]
          budget=95000
          used=0
          for name in files:
              p=Path(name)
              if not p.exists():
                  continue
              text=p.read_text(errors='replace')
              remaining=budget-used
              if remaining <= 0:
                  break
              text=text[:remaining]
              print(f'\n===== {name} =====\n{text}')
              used += len(text)
          PY
          )

          MODEL=$(grep -E '^MODEL=' "$HOME/.fcc/.env" | tail -n1 | cut -d= -f2-)
          STRATEGY_PROMPT=$(cat <<'PROMPT'
          Act as the complete senior development team defined in docs/AUTONOMOUS_TEAM.md for Jumpy. Perform a fresh systemic audit of the CURRENT project, not a generic game-design brainstorm.

          Think across creative direction, gameplay, engineering, architecture, UX/UI, visual feedback, audio/haptics, retention, progression, social/viral loops, accessibility, performance, QA, analytics, Android release and compliance. Identify root causes and second-order effects. If a path is blocked, propose alternate routes rather than stopping.

          Your job this cycle:
          1. Reassess the weakest quality domains and the biggest current bottleneck.
          2. Define the single highest-value SAFE immediate implementation that requires no new external account/API/paid service.
          3. Give concise acceptance criteria.
          4. List the next 3–7 actions after that, in priority order.
          5. State any blocker that must be recorded in SETUP_REQUIRED.txt.
          6. Challenge the existing roadmap if a better systemic sequence exists.

          Be demanding. Do not declare AAA/extreme completion without evidence. Keep the one-touch core simple while increasing depth and polish.
          PROMPT
          )
          PAYLOAD=$(python - "$MODEL" "$STRATEGY_PROMPT\n\n$CONTEXT" <<'PY'
          import json,sys
          print(json.dumps({'model':sys.argv[1],'max_tokens':4200,'messages':[{'role':'user','content':sys.argv[2]}],'stream':False}))
          PY
          )
          RESPONSE=$(curl -sS --max-time 150 -H 'Content-Type: application/json' -X POST http://127.0.0.1:8082/v1/messages --data-binary "$PAYLOAD" || true)
          python - "$RESPONSE" <<'PY' > /tmp/jumpy-strategy.txt
          import json,sys
          try:
              d=json.loads(sys.argv[1])
              text='\n'.join(str(x.get('text','')) for x in d.get('content',[]) if isinstance(x,dict) and x.get('type')=='text')
          except Exception:
              text='Strategic model response unavailable; continue with deterministic fallback backlog and re-audit next cycle.'
          print(text.strip()[-10000:])
          PY

          python - <<'PY' > /tmp/jumpy-candidates.txt
          from pathlib import Path
          main=Path('scripts/main.gd').read_text()
          candidates=[]
          if '"clutch": clutch' not in main:
              candidates.append(('CLUTCH_LANDING','Reward edge landings as a readable skill moment.'))
          if 'STREAK %d' not in main and 'ui.mission.text = "MISSIONS  •  RUNS %d/%d  •  PERFECT %d/%d\\nTOTAL SCORE %d/%d"' in main:
              candidates.append(('STREAK_MENU','Surface current streak on the home screen.'))
          if 'DAILY BEST %d' not in main and 'DAILY SEED • SAME WORLD FOR EVERYONE' in main:
              candidates.append(('DAILY_BEST_MENU','Surface the daily best score in daily mode.'))
          if 'PERFECT %d  •  COINS %d' not in main and 'ui.gameover.text = "SCORE %d\\nBEST %d\\n%s"' in main:
              candidates.append(('RUN_STATS_GAMEOVER','Improve post-run feedback with skill/run stats.'))
          for ident,desc in candidates:
              print(f'{ident}: {desc}')
          PY

          CHOICE=''
          if [ -s /tmp/jumpy-candidates.txt ]; then
            CHOICE=$(python - /tmp/jumpy-strategy.txt /tmp/jumpy-candidates.txt <<'PY'
          import re,sys
          strategy=open(sys.argv[1],errors='replace').read()
          ids=[line.split(':',1)[0].strip() for line in open(sys.argv[2]) if ':' in line]
          hits=[]
          for ident in ids:
              for m in re.finditer(r'\b'+re.escape(ident)+r'\b',strategy,re.I):
                  hits.append((m.start(),ident))
          print(sorted(hits)[-1][1] if hits else ids[0])
          PY
            )
          fi

          if [ -n "$CHOICE" ]; then
            echo "EXECUTION_LANE=deterministic:$CHOICE"
            python - "$CHOICE" <<'PY'
          from pathlib import Path
          import sys
          task=sys.argv[1]
          p=Path('scripts/main.gd')
          s=p.read_text()
          if task == 'CLUTCH_LANDING':
              old='''\tvar perfect: bool = absf(PLAYER_X - center) <= perfect_zone\n\tif perfect:\n\t\tcombo += 1\n\t\tperfects += 1\n\t\tflow = minf(5.0, 1.0 + float(combo) * 0.25)\n\t\tscore += int(18.0 * flow)\n\t\tcamera_kick = 9.0\n\t\tflash = 0.24\n\t\tburst(Vector2(PLAYER_X, player_y + PLAYER_R), Color("ffffff"), 22, 420.0)\n\t\tIntegrations.haptic(32)\n\telse:\n\t\tcombo = maxi(0, combo - 1)\n\t\tflow = maxf(1.0, 1.0 + float(combo) * 0.25)\n\t\tburst(Vector2(PLAYER_X, player_y + PLAYER_R), skin_color(), 6, 180.0)\n\tIntegrations.event("landing", {"perfect": perfect, "combo": combo, "score": score})'''
              new='''\tvar perfect: bool = absf(PLAYER_X - center) <= perfect_zone\n\tvar left_edge: float = float(p.x)\n\tvar right_edge: float = float(p.x) + float(p.w)\n\tvar edge_distance: float = minf(absf(PLAYER_X - left_edge), absf(right_edge - PLAYER_X))\n\tvar clutch: bool = not perfect and edge_distance <= PLAYER_R * 0.72\n\tif perfect:\n\t\tcombo += 1\n\t\tperfects += 1\n\t\tflow = minf(5.0, 1.0 + float(combo) * 0.25)\n\t\tscore += int(18.0 * flow)\n\t\tcamera_kick = 9.0\n\t\tflash = 0.24\n\t\tburst(Vector2(PLAYER_X, player_y + PLAYER_R), Color("ffffff"), 22, 420.0)\n\t\tIntegrations.haptic(32)\n\telif clutch:\n\t\tcombo += 1\n\t\tflow = minf(5.0, 1.0 + float(combo) * 0.18)\n\t\tscore += int(12.0 * flow)\n\t\tcamera_kick = 12.0\n\t\tburst(Vector2(PLAYER_X, player_y + PLAYER_R), Color("ffe66d"), 18, 360.0)\n\t\tIntegrations.haptic(26)\n\telse:\n\t\tcombo = maxi(0, combo - 1)\n\t\tflow = maxf(1.0, 1.0 + float(combo) * 0.25)\n\t\tburst(Vector2(PLAYER_X, player_y + PLAYER_R), skin_color(), 6, 180.0)\n\tIntegrations.event("landing", {"perfect": perfect, "clutch": clutch, "combo": combo, "score": score})'''
          elif task == 'STREAK_MENU':
              old='''\t\tui.mission.text = "MISSIONS  •  RUNS %d/%d  •  PERFECT %d/%d\\nTOTAL SCORE %d/%d" % [mission_data.runs, mission_data.runs_goal, mission_data.perfects, mission_data.perfects_goal, mission_data.score, mission_data.score_goal]'''
              new='''\t\tui.mission.text = "STREAK %d  •  MISSIONS  •  RUNS %d/%d  •  PERFECT %d/%d\\nTOTAL SCORE %d/%d" % [int(Profile.data.streak_days), mission_data.runs, mission_data.runs_goal, mission_data.perfects, mission_data.perfects_goal, mission_data.score, mission_data.score_goal]'''
          elif task == 'DAILY_BEST_MENU':
              old='''\tui.subtitle.text = "DAILY SEED • SAME WORLD FOR EVERYONE" if value else "TAP • LAND • FLOW"'''
              new='''\tui.subtitle.text = "DAILY SEED • DAILY BEST %d" % int(Profile.data.daily_best) if value else "TAP • LAND • FLOW"'''
          elif task == 'RUN_STATS_GAMEOVER':
              old='''\tui.gameover.text = "SCORE %d\\nBEST %d\\n%s" % [score, int(Profile.data.best_score), "NEW BEST" if score >= int(Profile.data.best_score) and score > 0 else "FLOW BROKEN"]'''
              new='''\tui.gameover.text = "SCORE %d\\nBEST %d\\nPERFECT %d  •  COINS %d\\n%s" % [score, int(Profile.data.best_score), perfects, run_coins, "NEW BEST" if score >= int(Profile.data.best_score) and score > 0 else "FLOW BROKEN"]'''
          else:
              raise SystemExit('unknown deterministic task')
          if s.count(old) != 1:
              raise SystemExit('deterministic source anchor mismatch for '+task)
          p.write_text(s.replace(old,new,1))
          PY
          else
            echo 'EXECUTION_LANE=open-ended'
            IMPLEMENT_PROMPT=$(cat <<'PROMPT'
          You are the senior implementation pair for Jumpy. Work directly in this isolated clone. Use the strategic review below as the brief. Implement ONE highest-value safe improvement that is feasible now.

          Constraints:
          - Godot 4.7 compatible.
          - Preserve one-touch simplicity and deterministic daily behavior.
          - Modify at most 3 EXISTING text files and about 250 changed lines.
          - Do not commit or push.
          - Do not edit .github/, secrets, signing, keystores, external API credentials, binary assets or paid-service configuration.
          - Do not add a new external dependency.
          - If blocked, choose a local substitute or another independent high-value improvement.
          - Review your edits before exiting.
          PROMPT
          )
            STRATEGY=$(cat /tmp/jumpy-strategy.txt)
            timeout -k 5s 360s fcc-opencode run "$IMPLEMENT_PROMPT\n\nSTRATEGIC REVIEW:\n$STRATEGY" >/tmp/jumpy-implement.log 2>&1 || true
          fi

          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          forbidden=[p for p in changed if p.startswith('.github/') or any(x in p.lower() for x in ['secret','keystore','.jks','.p12'])]
          if forbidden or len(changed)>3:
              print('Unsafe implementation candidate:',changed)
              subprocess.run(['git','reset','--hard','HEAD'],check=False,stdout=subprocess.DEVNULL)
          PY

          python - "$CHOICE" <<'PY'
          from pathlib import Path
          import datetime,re,sys
          p=Path('docs/AUTONOMOUS_STATE.md')
          s=p.read_text()
          strategy=Path('/tmp/jumpy-strategy.txt').read_text(errors='replace').strip()[-8000:]
          remaining=Path('/tmp/jumpy-candidates.txt').read_text(errors='replace').strip()
          choice=sys.argv[1] or 'OPEN_ENDED_STRATEGIC_TASK'
          now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          block=f'''<!-- AUTO_CYCLE_START -->\n## Latest autonomous strategic cycle\n**Time:** {now}  \n**Execution focus:** `{choice}`\n\n### Multidisciplinary review\n{strategy}\n\n### Remaining high-confidence immediate actions\n{remaining if remaining else 'Deterministic starter backlog exhausted. Continue from the strategic review using the open-ended implementation lane and regenerate priorities every cycle.'}\n\n### Operating instruction\nRe-audit the whole product next cycle. Do not mechanically repeat this plan if source changes or new evidence make another action higher-value.\n<!-- AUTO_CYCLE_END -->'''
          pattern=r'<!-- AUTO_CYCLE_START -->.*?<!-- AUTO_CYCLE_END -->'
          s=re.sub(pattern,block,s,flags=re.S) if re.search(pattern,s,re.S) else s.rstrip()+'\n\n'+block+'\n'
          p.write_text(s)
          PY

          CHANGED=$(git diff --name-only)
          if [ -z "$CHANGED" ]; then
            echo 'RESULT=NO_CHANGE'
            exit 0
          fi
          FILES=$(printf '%s\n' "$CHANGED" | paste -sd, -)
          PATCH_B64=$(git diff --binary | base64 -w0)
          echo 'RESULT=PATCH'
          echo "TASK=${CHOICE:-OPEN_ENDED_STRATEGIC_TASK}"
          echo "FILES=$FILES"
          echo "PATCH_B64=$PATCH_B64"
          REMOTE

          DATA=$(base64 -w0 /tmp/remote-cycle.sh)
          timeout -k 5s 720s gh codespace ssh -c "$NAME" "printf '%s' '$DATA' | base64 -d | bash" > /tmp/cycle.out
          sed -E 's/(PATCH_B64=).*/\1[REDACTED]/' /tmp/cycle.out
          RESULT=$(grep '^RESULT=' /tmp/cycle.out | tail -n1 | cut -d= -f2- || true)
          echo "result=${RESULT:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" = PATCH ]; then
            grep '^PATCH_B64=' /tmp/cycle.out | tail -n1 | cut -d= -f2- | base64 -d > /tmp/jumpy.patch
            echo 'has_patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_patch=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Jumpy
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/checkout@v4
        with:
          repository: dbrckk/Jumpy
          token: ${{ secrets.CODESPACES_PAT }}
          path: jumpy
          fetch-depth: 1

      - name: Apply candidate patch
        if: steps.patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          cd jumpy
          git apply --check /tmp/jumpy.patch
          git apply /tmp/jumpy.patch
          echo 'Candidate files:'
          git diff --name-only
          test -n "$(git diff --name-only)"

      - name: Install Godot 4.7.2 stable
        if: steps.patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-ci
          mv /tmp/godot-ci/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot-ci/godot
          chmod +x /tmp/godot-ci/godot

      - name: Validate candidate with real Godot
        if: steps.patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          cd jumpy
          /tmp/godot-ci/godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Cannot parse|Failed loading resource' /tmp/godot.log; then
            echo 'Blocking Godot error detected'
            exit 1
          fi
          test -f docs/AUTONOMOUS_TEAM.md
          test -f docs/AUTONOMOUS_STATE.md
          test -f docs/PRODUCTION_ROADMAP.md
          test -f SETUP_REQUIRED.txt

      - name: Commit validated evolution
        if: steps.patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          cd jumpy
          git config user.name 'jumpy-autocycle[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 -r git add --
          git diff --cached --quiet && { echo 'No effective validated change'; exit 0; }
          git commit -m 'Autocycle: systemic Jumpy evolution'
          git push origin HEAD:main

      - name: Cycle summary
        if: always()
        run: |
          echo '## Jumpy autonomous studio cycle' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cadence: every 30 minutes (:15 / :45)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Result: ${{ steps.patch.outputs.result }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Process: multidisciplinary audit → adaptive plan → implementation → Godot validation → living-state update → commit.' >> "$GITHUB_STEP_SUMMARY"
