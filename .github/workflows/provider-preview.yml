name: Real Provider Mobile Preview
on:
  workflow_dispatch:
  push:
    branches: [main, codex/mobile-journeys]
    paths: ['control/provider-probe.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-provider-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect previous provider failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34146251637 --repo "$GITHUB_REPOSITORY" --name provider-preview-1 --dir "$RUNNER_TEMP/provider-diagnostic"
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'provider-diagnostic/report.json').read_text())
          print(json.dumps({'status': report.get('status'), 'blockers': report.get('blockers')}, ensure_ascii=True))
          PYCODE
      - name: Generate and validate a bounded preview with the configured provider
        env:
          STUDIO_API_KEY: ${{ secrets.STUDIO_API_KEY || secrets.NVIDIA_NIM_API_KEY }}
          STUDIO_API_BASE: ${{ vars.STUDIO_API_BASE || 'https://integrate.api.nvidia.com/v1' }}
          STUDIO_MODEL: ${{ vars.STUDIO_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
          STUDIO_VISION_MODEL: ${{ vars.STUDIO_VISION_MODEL }}
        run: python studio/provider_probe.py
      - name: Retain real evidence and generated sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-preview-${{ github.run_number }}
          path: studio-output/
          if-no-files-found: warn
          retention-days: 14
