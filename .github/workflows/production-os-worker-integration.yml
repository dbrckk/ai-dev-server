name: Production-OS worker integration

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "control/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: worker-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:

  production-os-worker:
    name: Production-OS worker integration (${{ matrix.production_os.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        production_os:
          - label: historical-baseline
            sha: 7e0d47a8fd54e7faa3b3947b07259a5e065c3bdb
          - label: current-qualified-main-20261024
            sha: 2d7bab79ec27366d5c573a2db9387f414800dbfb
          - label: deployed-render-production-20261013
            sha: 972ef8328894d9cc1f18e7a6c7db96b5eb5b4aa1
    steps:
      - name: Checkout worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Checkout qualified Production-OS server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dbrckk/Production-OS
          ref: ${{ matrix.production_os.sha }}
          path: .integration/production-os
          persist-credentials: false

      - name: Verify exact Production-OS commit checked out
        env:
          EXPECTED_SERVER_SHA: ${{ matrix.production_os.sha }}
        run: test "$(git -C .integration/production-os rev-parse HEAD)" = "$EXPECTED_SERVER_SHA"

      - name: Install server and worker test dependencies
        run: python -m pip install ./.integration/production-os pytest

      - name: Verify worker lifecycle and capabilities
        run: >-
          python -m pytest -q
          tests/test_mobile_validation_contract.py
          tests/test_godot_model.py
          tests/test_request_contract.py
          tests/test_production_os_actions_worker_workflow.py
          tests/test_production_os_local_e2e.py
          tests/test_production_os_live_diagnostics.py
          tests/test_production_os_resume_objectives.py
          tests/test_production_os_remote_asset_capability.py
          tests/test_production_os_worker.py
          tests/test_production_os_worker_cli.py
          tests/test_production_os_worker_preflight.py
          tests/test_production_os_worker_runtime.py
          tests/test_production_os_worker_recovery.py
          tests/test_generic_worker_canary_resume.py
          tests/test_generic_repository_pull_request.py
          tests/test_generic_published_checkpoint.py
          tests/test_generic_published_round_checkpoint.py
          tests/test_execution_checkpoint.py
          tests/test_asset_forge_bridge.py
          tests/test_asset_forge_installer.py
          tests/test_imagen_codex_installer.py
          tests/test_ci_diagnostics.py
          tests/test_production_os_worker_canary.py

      - name: Verify authenticated real server integration
        env:
          REQUIRE_PRODUCTION_OS_INTEGRATION: "1"
        run: python -m unittest discover -s integration_tests -v
