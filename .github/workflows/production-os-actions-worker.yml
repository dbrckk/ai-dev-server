name: Production-OS Actions Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/production-os-worker-kick.json'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: production-os-actions-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCTION_OS_URL: ${{ vars.PRODUCTION_OS_URL || 'https://production-os1.onrender.com' }}
      PRODUCTION_OS_WORKER_TOKEN: ${{ secrets.PRODUCTION_OS_WORKER_TOKEN }}
      PRODUCTION_OS_WORKER_ID: github-actions-worker
      PRODUCTION_OS_WORKER_SPECIALTIES: mobile
      PRODUCTION_OS_STATUS_FILE: studio-output/production-os-actions/worker-status.json
      STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN || secrets.CODESPACES_PAT }}
      STUDIO_API_KEY: ${{ secrets.STUDIO_API_KEY || secrets.NVIDIA_NIM_API_KEY }}
      STUDIO_API_BASE: ${{ vars.STUDIO_API_BASE || 'https://integrate.api.nvidia.com/v1' }}
      STUDIO_MODEL: ${{ vars.STUDIO_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
      STUDIO_CODE_MODEL: ${{ vars.STUDIO_CODE_MODEL }}
      STUDIO_VISION_MODEL: ${{ vars.STUDIO_VISION_MODEL }}
      STUDIO_PERSIST_REMOTE: '1'
      PYTHONPATH: studio

    steps:
      - name: Checkout AI Dev Server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate worker configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in PRODUCTION_OS_WORKER_TOKEN STUDIO_GITHUB_TOKEN STUDIO_API_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 2
          fi
          python - <<'PY'
          from urllib.parse import urlsplit
          import os
          value=os.environ["PRODUCTION_OS_URL"].strip()
          parsed=urlsplit(value)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("PRODUCTION_OS_URL must be HTTPS")
          print("Production-OS Actions worker configuration: ready")
          PY

      - name: Wait for Production-OS readiness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["PRODUCTION_OS_URL"].rstrip("/")
          url = base + "/readyz"
          attempts = 12
          for attempt in range(1, attempts + 1):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"Accept": "application/json"},
                  )
                  with urllib.request.urlopen(request, timeout=5) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                      if (
                          int(getattr(response, "status", 200)) == 200
                          and payload.get("status") == "ready"
                      ):
                          print("Production-OS readiness: ready")
                          break
              except (
                  urllib.error.HTTPError,
                  urllib.error.URLError,
                  TimeoutError,
                  json.JSONDecodeError,
                  OSError,
              ):
                  pass
              if attempt == attempts:
                  raise SystemExit(
                      "Production-OS readiness failed after bounded retries"
                  )
              time.sleep(5)
          PY

      - name: Probe compatible Production-OS work
        id: queue_probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["PRODUCTION_OS_URL"].rstrip("/")
          token = os.environ["PRODUCTION_OS_WORKER_TOKEN"]
          payload = {
              "worker_id": os.environ["PRODUCTION_OS_WORKER_ID"],
              "capabilities": [
                  "android",
                  "node",
                  "python",
                  "repo-analysis",
                  "software-development",
                  "mobile-ui-validation",
              ],
          }
          request = urllib.request.Request(
              base + "/v1/jobs/availability",
              method="POST",
              data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )
          has_work = True
          probe_status = "fallback"
          try:
              with urllib.request.urlopen(request, timeout=5) as response:
                  body = json.loads(response.read().decode("utf-8"))
                  if int(getattr(response, "status", 200)) == 200:
                      has_work = bool(body.get("available"))
                      probe_status = "available" if has_work else "idle"
          except (
              urllib.error.HTTPError,
              urllib.error.URLError,
              TimeoutError,
              json.JSONDecodeError,
              OSError,
          ):
              # Backward-compatible fail-open behavior: older control planes
              # or transient probe failures keep the previous full worker path.
              has_work = True
              probe_status = "fallback"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"has_work={'true' if has_work else 'false'}\n")
              handle.write(f"probe_status={probe_status}\n")
          print(f"Production-OS queue probe: {probe_status}")
          PY

      - name: Install autonomous coding agent
        if: steps.queue_probe.outputs.has_work != 'false'
        run: npm install -g opencode-ai

      - name: Process one base-capability Production-OS job
        if: steps.queue_probe.outputs.has_work != 'false'
        id: base_job
        env:
          PRODUCTION_OS_WORKER_SPECIALTIES: ''
          STUDIO_CI_PROVIDER: github
        shell: bash
        run: |
          set -euo pipefail
          python studio/production_os_worker.py \
            --worker-id "$PRODUCTION_OS_WORKER_ID" \
            --output-root studio-output/production-os-actions \
            --status-file "$PRODUCTION_OS_STATUS_FILE" \
            --once
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PRODUCTION_OS_STATUS_FILE"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          status = str(payload.get("status") or "unknown")
          mobile_fallback = "true" if status == "idle" else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"status={status}\n")
              handle.write(f"mobile_fallback={mobile_fallback}\n")
          print(f"Base-capability worker result: {status}")
          PY

      - name: Prepare native mobile validation runtime
        if: steps.base_job.outputs.mobile_fallback == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set}"
          android_paths=(
            "$ANDROID_HOME/platform-tools"
            "$ANDROID_HOME/cmdline-tools/latest/bin"
            "$ANDROID_HOME/emulator"
          )
          for dir in "${android_paths[@]}"; do
            echo "$dir" >> "$GITHUB_PATH"
          done
          export PATH="$(IFS=:; echo "${android_paths[*]}"):$PATH"

          missing=()
          for name in adb sdkmanager avdmanager emulator; do
            command -v "$name" >/dev/null 2>&1 || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "Android tools missing (${missing[*]}), using bounded bootstrap"
            bash scripts/bootstrap-android-ci.sh
            export PATH="$(IFS=:; echo "${android_paths[*]}"):$PATH"
          fi

          for name in adb sdkmanager avdmanager emulator; do
            command -v "$name"
          done
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          emulator -accel-check

      - name: Process one mobile-capable Production-OS job
        if: steps.base_job.outputs.mobile_fallback == 'true'
        env:
          STUDIO_CI_PROVIDER: github
        run: |
          python studio/production_os_worker.py \
            --worker-id "$PRODUCTION_OS_WORKER_ID" \
            --output-root studio-output/production-os-actions \
            --status-file "$PRODUCTION_OS_STATUS_FILE" \
            --once

      - name: Retain worker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-os-actions-worker-${{ github.run_number }}
          path: studio-output/production-os-actions/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production-OS Actions Worker"
            echo
            echo "Codespace dependency: none"
            echo "Control plane: $PRODUCTION_OS_URL"
            echo "Worker id: $PRODUCTION_OS_WORKER_ID"
            echo "Polling mode: scheduled every 5 minutes + manual dispatch"
            echo "Queue preflight: ${{ steps.queue_probe.outputs.probe_status || 'not-run' }}"
            echo "Base-pass status: ${{ steps.base_job.outputs.status || 'not-run' }}"
            echo "Android fallback used: ${{ steps.base_job.outputs.mobile_fallback || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
