name: Jumpy Autonomous Evolution

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - control/jumpy-cycle-request.txt

concurrency:
  group: jumpy-autonomous-evolution
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
      TARGET_REPO: dbrckk/Jumpy
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Validate controller credentials
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'Missing CODESPACES_PAT'; exit 1; }

      - name: Find and wake AI Codespace
        id: codespace
        run: |
          set -euo pipefail
          NAME=$(gh codespace list --json name,repository --jq '.[] | select(.repository == "dbrckk/ai-dev-server") | .name' | head -n1)
          test -n "$NAME" || { echo 'AI Dev Server Codespace not found'; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          STATE=$(gh codespace view -c "$NAME" --json state --jq .state 2>/dev/null || true)
          if [ "$STATE" != Available ]; then
            curl -fsSL -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/user/codespaces/$NAME/start" >/dev/null || true
          fi
          for i in {1..90}; do
            STATE=$(gh codespace view -c "$NAME" --json state --jq .state 2>/dev/null || true)
            [ "$STATE" = Available ] && exit 0
            sleep 5
          done
          echo 'Codespace did not become available'
          exit 1

      - name: Sync autonomous worker
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          DATA=$(tar -czf - scripts/jumpy-cycle.sh | base64 -w0)
          timeout 60s gh codespace ssh -c "$NAME" "printf '%s' '$DATA' | base64 -d | tar -xzf - -C /workspaces/ai-dev-server"

      - name: Run one credential-free evolution cycle
        id: cycle
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          timeout 300s gh codespace ssh -c "$NAME" 'cd /workspaces/ai-dev-server && bash scripts/jumpy-cycle.sh' > remote-output.txt
          STATUS=$(grep '^CYCLE_STATUS=' remote-output.txt | tail -n1 | cut -d= -f2- || true)
          echo "status=${STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "Cycle status: ${STATUS:-UNKNOWN}"
          grep '^CHANGED_FILES=' remote-output.txt || true

      - name: Extract proposed patch
        if: steps.cycle.outputs.status == 'PATCH_READY'
        run: |
          set -euo pipefail
          awk '/^PATCH_B64_BEGIN$/{f=1;next}/^PATCH_B64_END$/{f=0}f' remote-output.txt | tr -d '\n' | base64 -d > cycle.patch
          test -s cycle.patch

      - name: Verify target repository write access
        if: steps.cycle.outputs.status == 'PATCH_READY'
        run: |
          set -euo pipefail
          PUSH=$(gh api repos/$TARGET_REPO --jq '.permissions.push // false')
          if [ "$PUSH" != true ]; then
            echo 'CODESPACES_PAT does not have push permission to dbrckk/Jumpy.'
            echo 'Grant this PAT Contents: Read and write on Jumpy; do not paste the token into chat.'
            exit 1
          fi

      - name: Apply patch in authenticated runner clone
        if: steps.cycle.outputs.status == 'PATCH_READY'
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 1 https://github.com/$TARGET_REPO.git /tmp/Jumpy
          cd /tmp/Jumpy
          git apply --index --binary "$GITHUB_WORKSPACE/cycle.patch"
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo 'Autonomous cycle attempted to modify GitHub automation; rejecting.'
            exit 1
          fi
          git diff --cached --check

      - name: Scan staged patch for credential patterns
        if: steps.cycle.outputs.status == 'PATCH_READY'
        run: |
          set -euo pipefail
          cd /tmp/Jumpy
          if git diff --cached | grep -Eiq '(github_pat_|ghp_|ghu_|nvapi-|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'; then
            echo 'Credential-like material detected; rejecting cycle.'
            exit 1
          fi

      - name: Validate with Godot 4.7.2
        if: steps.cycle.outputs.status == 'PATCH_READY'
        run: |
          set -euo pipefail
          cd /tmp/Jumpy
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          rm -rf /tmp/godot-ci && mkdir -p /tmp/godot-ci
          unzip -q /tmp/godot.zip -d /tmp/godot-ci
          mv /tmp/godot-ci/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot-ci/godot
          chmod +x /tmp/godot-ci/godot
          set +e
          /tmp/godot-ci/godot --headless --path . --editor --quit > /tmp/godot.log 2>&1
          RC=$?
          set -e
          cat /tmp/godot.log
          if [ "$RC" -ne 0 ] || grep -E 'SCRIPT ERROR|Parse Error|Cannot parse|Failed loading resource' /tmp/godot.log; then
            echo 'Godot validation failed; autonomous patch will not be pushed.'
            exit 1
          fi

      - name: Commit validated evolution
        if: steps.cycle.outputs.status == 'PATCH_READY'
        run: |
          set -euo pipefail
          cd /tmp/Jumpy
          git config user.name 'jumpy-autonomous[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Autonomous Jumpy evolution $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo '## Jumpy autonomous evolution' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ steps.cycle.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f remote-output.txt ]; then
            grep '^CHANGED_FILES=' remote-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo 'Schedule: minute 7 and 37 of every hour.' >> "$GITHUB_STEP_SUMMARY"
