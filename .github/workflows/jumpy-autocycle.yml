name: Jumpy Autonomous Evolution

on:
  schedule:
    # Avoid minute 0 where GitHub notes higher scheduler load.
    - cron: '15,45 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jumpy-autocycle.yml'

permissions:
  contents: read

concurrency:
  group: jumpy-autonomous-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
      INFRA_REPO: dbrckk/ai-dev-server
      GAME_REPO: dbrckk/Jumpy
    steps:
      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'Missing CODESPACES_PAT'; exit 1; }

      - name: Find and wake AI Codespace
        id: codespace
        run: |
          set -euo pipefail
          NAME=$(gh codespace list --json name,repository --jq ".[] | select(.repository == \"$INFRA_REPO\") | .name" | head -n1)
          test -n "$NAME" || { echo 'No ai-dev-server Codespace found'; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          STATE=$(gh codespace view -c "$NAME" --json state --jq .state)
          if [ "$STATE" != Available ]; then
            curl -fsSL -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/user/codespaces/$NAME/start" >/dev/null || true
          fi
          for i in {1..120}; do
            STATE=$(gh codespace view -c "$NAME" --json state --jq .state 2>/dev/null || true)
            [ "$STATE" = Available ] && exit 0
            sleep 5
          done
          echo 'Codespace did not become available'
          exit 1

      - name: Generate deterministic FCC edit plan
        id: patch
        run: |
          set -euo pipefail
          NAME='${{ steps.codespace.outputs.name }}'
          cat > /tmp/remote-cycle.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          BASE="$HOME/.cache/ai-dev-server"
          mkdir -p "$BASE/logs"

          if ! curl -fsS --max-time 3 http://127.0.0.1:8082/health >/dev/null 2>&1; then
            nohup fcc-server >"$BASE/logs/fcc.log" 2>&1 < /dev/null &
            for i in {1..30}; do
              curl -fsS --max-time 2 http://127.0.0.1:8082/health >/dev/null 2>&1 && break
              sleep 1
            done
          fi
          curl -fsS --max-time 3 http://127.0.0.1:8082/health >/dev/null

          WORK=/tmp/jumpy-autocycle
          rm -rf "$WORK"
          git clone --depth 1 https://github.com/dbrckk/Jumpy.git "$WORK" >/dev/null 2>&1
          cd "$WORK"

          CONTEXT=$(python - <<'PY'
          from pathlib import Path
          wanted = [
              'README.md','docs/PRODUCTION_ROADMAP.md','docs/GAME_DESIGN.md','SETUP_REQUIRED.txt',
              'project.godot','scripts/main.gd','scripts/profile.gd','scripts/integrations.gd','assets/ui/theme.tres'
          ]
          total=0
          for name in wanted:
              p=Path(name)
              if not p.exists():
                  continue
              text=p.read_text(errors='replace')
              if total+len(text)>75000:
                  text=text[:max(0,75000-total)]
              print(f'\n===== FILE: {name} =====\n{text}')
              total += len(text)
              if total>=75000:
                  break
          PY
          )

          MODEL=$(grep -E '^MODEL=' "$HOME/.fcc/.env" | tail -n1 | cut -d= -f2-)
          PROMPT=$(cat <<'PROMPT_END'
          You are the autonomous senior game engineer for Jumpy, a Godot 4.7 portrait mobile arcade game aiming for exceptional viral/hybrid-casual quality.

          Review the supplied current repository files and choose exactly ONE highest-impact SAFE improvement that can be completed now. Prefer core feel, retention, clarity, replayability, polish, accessibility, deterministic daily play, progression, or robust code. Follow the production roadmap.

          You are NOT writing a git diff. Return exact deterministic search/replace edits copied from the supplied files. Maximum 3 edits across maximum 2 existing text files. Each search string must be copied EXACTLY from the current file and should be long enough to occur exactly once. Keep the total change focused (roughly <=180 lines). Do not edit .github/, export signing, credentials, secrets, network calls, external plugins, paid services, API dependencies, store actions, or binary assets. Do not weaken deterministic daily generation or existing safety.

          Return ONLY:
          NO_CHANGE: <reason>
          or
          EDIT_JSON_START
          {"summary":"short description","edits":[{"path":"scripts/example.gd","search":"exact existing text","replace":"exact replacement text"}]}
          EDIT_JSON_END

          JSON must be valid. Do not include markdown fences.
          PROMPT_END
          )
          PROMPT="$PROMPT\n\n$CONTEXT"
          PAYLOAD=$(python - "$MODEL" "$PROMPT" <<'PY'
          import json,sys
          print(json.dumps({
              'model':sys.argv[1],
              'max_tokens':5200,
              'messages':[{'role':'user','content':sys.argv[2]}],
              'stream':False
          }))
          PY
          )
          RESPONSE=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -X POST http://127.0.0.1:8082/v1/messages --data-binary "$PAYLOAD" || true)

          python - "$RESPONSE" <<'PY'
          import base64,json,re,subprocess,sys
          from pathlib import Path
          try:
              d=json.loads(sys.argv[1])
              text='\n'.join(str(x.get('text','')) for x in d.get('content',[]) if isinstance(x,dict) and x.get('type')=='text')
          except Exception as e:
              print('RESULT=INVALID_RESPONSE')
              print('REASON='+str(e)[:250])
              raise SystemExit(0)
          if 'NO_CHANGE:' in text and 'EDIT_JSON_START' not in text:
              print('RESULT=NO_CHANGE')
              print('REASON='+text.split('NO_CHANGE:',1)[1].strip().splitlines()[0][:300])
              raise SystemExit(0)
          m=re.search(r'EDIT_JSON_START\s*\n(.*?)\nEDIT_JSON_END',text,re.S)
          if not m:
              print('RESULT=NO_EDIT_PLAN')
              print('REASON=missing_structured_edit_markers')
              raise SystemExit(0)
          try:
              plan=json.loads(m.group(1).strip())
          except Exception as e:
              print('RESULT=INVALID_EDIT_JSON')
              print('REASON='+str(e)[:250])
              raise SystemExit(0)
          edits=plan.get('edits',[])
          if not isinstance(edits,list) or not 1 <= len(edits) <= 3:
              print('RESULT=SAFETY_REJECTED')
              print('REASON=invalid_edit_count')
              raise SystemExit(0)
          paths=[]
          for edit in edits:
              path=str(edit.get('path',''))
              search=str(edit.get('search',''))
              replace=str(edit.get('replace',''))
              if (not path or path.startswith('.github/') or any(s in path.lower() for s in ['secret','keystore','.jks','.p12']) or not search):
                  print('RESULT=SAFETY_REJECTED')
                  print('REASON=forbidden_path_or_empty_search')
                  raise SystemExit(0)
              p=Path(path)
              if not p.is_file():
                  print('RESULT=EDIT_REJECTED')
                  print('REASON=path_not_existing_text_file:'+path)
                  raise SystemExit(0)
              content=p.read_text(errors='strict')
              count=content.count(search)
              if count != 1:
                  print('RESULT=EDIT_REJECTED')
                  print('REASON=search_match_count_%d:%s' % (count,path))
                  raise SystemExit(0)
              p.write_text(content.replace(search,replace,1))
              paths.append(path)
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if len(changed)>2 or len(set(paths))>2 or not changed:
              print('RESULT=SAFETY_REJECTED')
              print('REASON=changed_file_limit')
              raise SystemExit(0)
          stat=subprocess.check_output(['git','diff','--numstat'],text=True)
          churn=sum(sum(int(x) for x in line.split()[:2] if x.isdigit()) for line in stat.splitlines())
          if churn>260:
              print('RESULT=SAFETY_REJECTED')
              print('REASON=change_too_large')
              raise SystemExit(0)
          patch=subprocess.check_output(['git','diff','--binary'])
          print('RESULT=PATCH')
          print('SUMMARY='+re.sub(r'\s+',' ',str(plan.get('summary','improvement')))[:300])
          print('FILES='+','.join(changed))
          print('PATCH_B64='+base64.b64encode(patch).decode())
          PY
          REMOTE
          DATA=$(base64 -w0 /tmp/remote-cycle.sh)
          timeout -k 5s 230s gh codespace ssh -c "$NAME" "printf '%s' '$DATA' | base64 -d | bash" > /tmp/cycle.out || true
          sed -E 's/(PATCH_B64=).*/\1[REDACTED]/' /tmp/cycle.out
          RESULT=$(grep '^RESULT=' /tmp/cycle.out | tail -n1 | cut -d= -f2- || true)
          echo "result=${RESULT:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" = PATCH ]; then
            grep '^PATCH_B64=' /tmp/cycle.out | tail -n1 | cut -d= -f2- | base64 -d > /tmp/jumpy.patch
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Jumpy
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/checkout@v4
        with:
          repository: dbrckk/Jumpy
          token: ${{ secrets.CODESPACES_PAT }}
          path: jumpy
          fetch-depth: 1

      - name: Apply candidate patch
        if: steps.patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          cd jumpy
          git apply --check /tmp/jumpy.patch
          git apply /tmp/jumpy.patch
          echo 'Candidate files:'
          git diff --name-only
          test -n "$(git diff --name-only)"

      - name: Install Godot 4.7.2 stable
        if: steps.patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-ci
          mv /tmp/godot-ci/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot-ci/godot
          chmod +x /tmp/godot-ci/godot

      - name: Validate candidate with real Godot
        if: steps.patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          cd jumpy
          set -o pipefail
          /tmp/godot-ci/godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Cannot parse|Failed loading resource' /tmp/godot.log; then
            echo 'Blocking Godot error detected'
            exit 1
          fi
          test -f SETUP_REQUIRED.txt
          test -f docs/PRODUCTION_ROADMAP.md

      - name: Commit validated improvement
        if: steps.patch.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          cd jumpy
          git config user.name 'jumpy-autocycle[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No effective change'; exit 0; }
          git commit -m "Autocycle: evolve Jumpy safely"
          git push origin HEAD:main

      - name: Cycle summary
        if: always()
        run: |
          echo "## Jumpy autonomous cycle" >> "$GITHUB_STEP_SUMMARY"
          echo "Schedule: minute 15 and 45 of every hour" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ steps.patch.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.patch.outputs.has_patch }}' = 'true' ]; then
            echo 'Candidate created from deterministic exact-match edits; commit occurs only after real Godot validation.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No repository write was attempted this cycle.' >> "$GITHUB_STEP_SUMMARY"
          fi
